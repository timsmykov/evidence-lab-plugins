name: release-snapshot

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements-ci.txt

      - name: Scan working tree and complete history for secrets
        run: scripts/verify_secrets.sh

      - name: Verify immutable tag identity
        run: |
          git fetch origin main
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Verify repository
        run: |
          python3 scripts/build_adapters.py --check
          python3 scripts/test_agent_first.py
          python3 scripts/test_bootstrap.py
          python3 scripts/test_normalization.py
          python3 scripts/test_pack_boundaries.py
          python3 scripts/test_pack_behaviors.py
          python3 scripts/analyze_pack_boundaries.py --check
          python3 scripts/test_release_snapshot.py
          python3 scripts/verify_repo.py

      - name: Build release lock and notes
        run: |
          mkdir -p dist
          python3 scripts/release_snapshot.py build \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --require-main \
            --output dist/release-lock.json \
            --notes dist/release-notes.md
          python3 scripts/release_snapshot.py verify dist/release-lock.json

      - name: Stage, verify, and publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$existing" != "true" ]; then
              echo "FAIL: published release already exists; immutable assets will not be replaced"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "Evidence Lab $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            dist/release-lock.json
          download_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --pattern release-lock.json --dir "$download_dir"
          test "$(sha256sum dist/release-lock.json | cut -d' ' -f1)" = \
            "$(sha256sum "$download_dir/release-lock.json" | cut -d' ' -f1)"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
