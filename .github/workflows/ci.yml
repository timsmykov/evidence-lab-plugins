name: verify

env:
  PYTHONDONTWRITEBYTECODE: "1"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet --require-hashes -r requirements-ci.txt

      - name: Scan working tree and complete history for secrets
        run: scripts/verify_secrets.sh

      - name: Host adapters and marketplaces are generated
        run: python3 scripts/build_adapters.py --check

      - name: Agent-first onboarding and adapter parity
        run: |
          python3 scripts/test_agent_first.py
          python3 scripts/test_bootstrap.py
          python3 scripts/test_normalization.py

      - name: Pack-boundary evidence is valid and reproducible
        run: |
          python3 scripts/test_pack_boundaries.py
          python3 scripts/test_pack_behaviors.py
          python3 scripts/analyze_pack_boundaries.py --check

      - name: Immutable release lock is deterministic
        run: python3 scripts/test_release_snapshot.py

      - name: Verify repository
        run: python3 scripts/verify_repo.py

      - name: Pack scaffolder works and the gate rejects placeholders
        run: |
          python3 scripts/new_pack.py ci-smoke-pack --layer workflow --skill ci-smoke-skill --owner CI --reviewer CI
          python3 scripts/build_adapters.py
          test -f packs/workflows/ci-smoke-pack/.claude-plugin/plugin.json
          test -f packs/workflows/ci-smoke-pack/.codex-plugin/plugin.json
          test -f packs/workflows/ci-smoke-pack/skills/ci-smoke-skill/SKILL.md
          if python3 scripts/verify_repo.py > /dev/null 2>&1; then
            echo "FAIL: verifier accepted a pack full of placeholders"
            rm -rf packs/workflows/ci-smoke-pack
            exit 1
          fi
          rm -rf packs/workflows/ci-smoke-pack
          python3 scripts/build_adapters.py
          if python3 scripts/new_pack.py ../outside --layer workflow --skill unsafe --owner CI --reviewer CI; then
            echo "FAIL: scaffolder accepted a path-like plugin name"
            exit 1
          fi

      - name: Deterministic script is reproducible
        run: |
          cd packs/domains/example-domain/skills/example-procedure
          cat > /tmp/extracted.json <<'JSON'
          {"features": ["year"], "documents": [{"id": "d1", "source": "a.pdf", "values": {"year": "2024"}}], "unreadable": []}
          JSON
          python3 scripts/build_table.py /tmp/extracted.json --out /tmp/first.md
          python3 scripts/build_table.py /tmp/extracted.json --out /tmp/second.md
          cmp /tmp/first.md /tmp/second.md
